<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #b9c9cc, #a6b4b8);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: background 1.5s ease;
            animation: gradientAnimation 15s ease infinite;
            background-size: 400% 400%;
        }
        
        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            transform: translateY(0);
            transition: all 0.5s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        
        .search-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        
        .search-box input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            outline: none;
            font-size: 16px;
            border-radius: 30px;
            background-color: #f5f5f5;
            margin-right: 10px;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .search-box input:focus {
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
            background-color: #ffffff;
        }
        
        .search-box button {
            width: 50px;
            height: 50px;
            border: none;
            outline: none;
            background-color: #0083b0;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 18px;
            transition: all 0.3s ease;
            box-shadow: 0 3px 10px rgba(0, 131, 176, 0.5);
        }
        
        .search-box button:hover {
            background-color: #006a8e;
            transform: scale(1.1);
        }
        
        .weather-info {
            text-align: center;
            opacity: 1;
            transition: opacity 0.5s ease;
        }
        
        .weather-icon {
            width: 140px;
            margin: 0 auto;
            animation: floatIcon 3s ease-in-out infinite;
        }
        
        @keyframes floatIcon {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0px);
            }
        }
        
        .temperature {
            font-size: 60px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        .location {
            font-size: 28px;
            font-weight: 500;
            margin-bottom: 20px;
            color: #333;
            position: relative;
            display: inline-block;
        }
        
        .location::after {
            content: '';
            position: absolute;
            width: 50%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #0083b0, transparent);
            bottom: -10px;
            left: 25%;
            border-radius: 2px;
        }
        
        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
            animation: fadeIn 1s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .col {
            flex: 1;
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            transition: all 0.3s ease;
            background-color: rgba(245, 245, 245, 0.7);
            margin: 0 5px;
        }
        
        .col:hover {
            background-color: rgba(235, 235, 235, 0.9);
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .col img {
            width: 45px;
            margin-bottom: 10px;
            transition: transform 0.3s ease;
        }
        
        .col:hover img {
            transform: scale(1.1);
        }
        
        .humidity, .wind {
            font-size: 15px;
            color: #555;
        }
        
        .humidity span, .wind span {
            display: block;
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-top: 8px;
        }
        
        .error {
            display: none;
            text-align: center;
            color: #e74c3c;
            font-size: 16px;
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            background-color: rgba(231, 76, 60, 0.1);
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% {transform: translateX(0);}
            10%, 30%, 50%, 70%, 90% {transform: translateX(-5px);}
            20%, 40%, 60%, 80% {transform: translateX(5px);}
        }
        
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 131, 176, 0.3);
            border-radius: 50%;
            border-top: 4px solid #0083b0;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <input type="text" placeholder="Enter city name" id="city-input">
            <button id="search-btn">
                <i>🔍</i>
            </button>
        </div>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
        </div>
        
        <div class="weather-info">
            <img src="https://openweathermap.org/img/wn/10d@2x.png" alt="Weather Icon" class="weather-icon" id="weather-icon">
            <h1 class="temperature" id="temperature">--°C</h1>
            <h2 class="location" id="cityName">city</h2>
            
            <div class="details">
                <div class="col">
                    <img src="https://cdn-icons-png.flaticon.com/512/219/219816.png" alt="Humidity">
                    <div class="humidity">
                        <p>Humidity</p>
                        <span id="humidity">--%</span>
                    </div>
                </div>
                <div class="col">
                    <img src="https://cdn-icons-png.flaticon.com/512/172/172922.png" alt="Wind">
                    <div class="wind">
                        <p>Wind Speed</p>
                        <span id="wind-speed">-- km/h</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="error" id="error-message">
            City not found. Please check the city name and try again.
        </div>
    </div>

    <script src="Script.js"></script>
</body>
</html>
