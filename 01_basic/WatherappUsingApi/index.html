<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        .search-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        
        .search-box input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            outline: none;
            font-size: 16px;
            border-radius: 25px;
            background-color: #f5f5f5;
            margin-right: 10px;
        }
        
        .search-box button {
            width: 45px;
            height: 45px;
            border: none;
            outline: none;
            background-color: #0083b0;
            border-radius: 50%;
            cursor: pointer;
            color: white;
            font-size: 18px;
            transition: background-color 0.3s;
        }
        
        .search-box button:hover {
            background-color: #006a8e;
        }
        
        .weather-info {
            text-align: center;
        }
        
        .weather-icon {
            width: 120px;
            margin: 0 auto;
        }
        
        .temperature {
            font-size: 48px;
            font-weight: bold;
            margin: 10px 0;
            color: #333;
        }
        
        .location {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #333;
        }
        
        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }
        
        .col {
            flex: 1;
            text-align: center;
            padding: 10px;
        }
        
        .col img {
            width: 40px;
            margin-bottom: 5px;
        }
        
        .humidity, .wind {
            font-size: 14px;
            color: #666;
        }
        
        .humidity span, .wind span {
            display: block;
            font-size: 20px;
            font-weight: 500;
            color: #333;
            margin-top: 5px;
        }
        
        .error {
            display: none;
            text-align: center;
            color: #e74c3c;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="search-box">
            <input type="text" placeholder="Enter city name" id="city-input">
            <button id="search-btn">
                <i>🔍</i>
            </button>
        </div>
        
        <div class="weather-info">
            <img src="https://openweathermap.org/img/wn/10d@2x.png" alt="Weather Icon" class="weather-icon" id="weather-icon">
            <h1 class="temperature" id="temperature">--°C</h1>
            <h2 class="location" id="cityName">city</h2>
            
            <div class="details">
                <div class="col">
                    <img src="https://cdn-icons-png.flaticon.com/512/219/219816.png" alt="Humidity">
                    <div class="humidity">
                        <p>Humidity</p>
                        <span id="humidity">--%</span>
                    </div>
                </div>
                <div class="col">
                    <img src="https://cdn-icons-png.flaticon.com/512/172/172922.png" alt="Wind">
                    <div class="wind">
                        <p>Wind Speed</p>
                        <span id="wind-speed">-- km/h</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="error" id="error-message">
            City not found. Please check the city name and try again.
        </div>
    </div>

    <script src="Script.js"></script>
</body>
</html>
